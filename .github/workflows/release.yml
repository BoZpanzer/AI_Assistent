name: Release (Windows)

# Auslöser: ein Versions-Tag, z. B.  git tag v3.3.0 && git push origin v3.3.0
# Baut JARVIS.exe + JARVIS_Setup.exe, testet sie, signiert das Update-Manifest
# und veröffentlicht alles als GitHub-Release. Die App findet es dann über
# „Aktualisieren“ (Einstellungen bzw. Button oben in der Titelleiste).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version, z. B. v3.3.1 (Tag wird angelegt)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Version aus dem Tag übernehmen
        shell: pwsh
        run: |
          $v = $env:TAG -replace '^v',''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '$env:TAG' ist keine Version wie v3.3.1" }
          npm version $v --no-git-tag-version --allow-same-version
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Update-Quelle einbauen (dieses Repo)
        shell: pwsh
        run: |
          if (!(Test-Path build/update-public-key.pem)) { throw "build/update-public-key.pem fehlt – siehe docs/UPDATES.md" }
          '{ "repo": "${{ github.repository }}" }' | Out-File -Encoding utf8NoBOM build/update-config.json

      - name: Abhängigkeiten (gepinnt)
        run: npm ci

      - name: Unit- & Integrationstests
        env:
          JARVIS_SKIP_WAKEWORD_AUDIO: '1'
        run: npm run test:ci

      - name: NSIS installieren
        run: choco install nsis -y --no-progress

      - name: Icons erzeugen (falls nicht eingecheckt)
        shell: pwsh
        run: if (!(Test-Path build/icon.ico)) { npx electron scripts/make-icons.js }

      - name: Windows-Build
        env:
          MAKENSIS: C:\Program Files (x86)\NSIS\makensis.exe
        run: npm run dist:win

      - name: Mitgeliefertes Offline-Whisper im Windows-Build prüfen
        shell: pwsh
        run: |
          $voice = "release/win-unpacked/resources/voice"
          if (!(Test-Path "$voice/whisper-cli.exe")) { throw "Mitgelieferte Whisper-Engine fehlt" }
          if (!(Test-Path "$voice/ggml-base.bin")) { throw "Mitgeliefertes Whisper-Modell fehlt" }
          $hash = (Get-FileHash "$voice/ggml-base.bin" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe') { throw "Whisper-Modell SHA-256 stimmt nicht" }
          Write-Host "Verifizierte Whisper-Engine und Modell liegen im Installer-Paket"
      - name: Smoke-Test der gebauten App
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release\win-unpacked\JARVIS.exe" -ArgumentList "--smoke" -PassThru -Wait
          Get-Content "$env:TEMP\jarvis-smoke-report.json"
          if ($p.ExitCode -ne 0) { throw "Smoke-Test fehlgeschlagen ($($p.ExitCode))" }

      - name: Installer installieren, starten und deinstallieren
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\JARVIS-Release-Install"
          $i = Start-Process -FilePath "release\JARVIS_Setup.exe" -ArgumentList "/S","/D=$dir" -PassThru -Wait
          if ($i.ExitCode -ne 0) { throw "Release-Installation fehlgeschlagen" }
          if (!(Test-Path "$dir\JARVIS.exe")) { throw "JARVIS.exe fehlt nach Installation" }
          if (!(Test-Path "$dir\resources\voice\whisper-cli.exe")) { throw "Offline-Whisper fehlt nach Installation" }
          if (!(Test-Path "$dir\resources\voice\ggml-base.bin")) { throw "Offline-Sprachmodell fehlt nach Installation" }
          $s = Start-Process -FilePath "$dir\JARVIS.exe" -ArgumentList "--smoke" -PassThru -Wait
          if ($s.ExitCode -ne 0) { throw "Installierte Release-App: Smoke-Test fehlgeschlagen" }
          $u = Start-Process -FilePath "$dir\Uninstall JARVIS.exe" -ArgumentList "/S" -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw "Deinstallation fehlgeschlagen" }
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\JARVIS.exe") { throw "Release-Deinstallation unvollständig" }
          Write-Host "Release-Installer, erster Start, Offline-Whisper und Deinstallation geprüft"

      - name: Update-Manifest signieren
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: node scripts/sign-update.mjs

      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @('release/JARVIS_Setup.exe', 'release/update.json', 'release/SHA256SUMS.txt')
          $out = ''
          for ($i = 1; $i -le 3; $i++) {
            gh release view $env:TAG *> $null
            if ($LASTEXITCODE -eq 0) {
              $out = gh release upload $env:TAG @assets --clobber 2>&1
              if ($LASTEXITCODE -eq 0) { $out = gh release edit $env:TAG --draft=false --prerelease=false --latest --title "JARVIS $env:VERSION" --notes-file release/RELEASE_NOTES.md 2>&1 }
            }
            else { $out = gh release create $env:TAG @assets --latest --title "JARVIS $env:VERSION" --notes-file release/RELEASE_NOTES.md --target $env:GITHUB_SHA 2>&1 }
            if ($LASTEXITCODE -eq 0) { Write-Host ($out -join "`n"); exit 0 }
            $msg = ($out -join ' ') -replace '[\r\n]+', ' '
            Write-Host "::warning::Veröffentlichen, Versuch $i fehlgeschlagen: $msg"
            Start-Sleep -Seconds 20
          }
          Write-Host "::error::Release konnte nicht veröffentlicht werden: $msg"
          exit 1

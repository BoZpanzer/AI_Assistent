name: JARVIS 3.33.0 Release anstossen

# Einmalige Bruecke: startet den bestehenden Release-Workflow ohne Weboberflaeche.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-3-33-0-trigger.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.head_commit.message == 'JARVIS 3.33.0 Release starten'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bestehenden Release-Workflow fuer v3.33.0 starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f tag=v3.33.0 -R "$GITHUB_REPOSITORY"

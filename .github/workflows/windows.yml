name: Windows Build & Test

# Vollständiger Windows-Build inkl. Installations-/Deinstallationstest – manuell
# startbar (Actions → „Windows Build & Test“ → Run workflow) und bei Pull Requests.
# Releases baut release.yml (Tag v*), schnelle Tests laufen in tests.yml.
on:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten (gepinnt, package-lock)
        run: npm ci
      - name: Unit- & Integrationstests
        env:
          JARVIS_SKIP_WAKEWORD_AUDIO: '1'
        run: npm run test:ci
      - name: NSIS installieren
        run: choco install nsis -y --no-progress
      - name: Icons erzeugen (falls nicht eingecheckt)
        shell: pwsh
        run: if (!(Test-Path build/icon.ico)) { npx electron scripts/make-icons.js }
      - name: Windows-Build (JARVIS.exe + JARVIS_Setup.exe)
        env:
          MAKENSIS: C:\Program Files (x86)\NSIS\makensis.exe
        run: npm run dist:win
      - name: Mitgeliefertes Offline-Whisper im Windows-Build prüfen
        shell: pwsh
        run: |
          $voice = "release/win-unpacked/resources/voice"
          if (!(Test-Path "$voice/whisper-cli.exe")) { throw "Mitgelieferte Whisper-Engine fehlt" }
          if (!(Test-Path "$voice/ggml-base.bin")) { throw "Mitgeliefertes Whisper-Modell fehlt" }
          $hash = (Get-FileHash "$voice/ggml-base.bin" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe') { throw "Whisper-Modell SHA-256 stimmt nicht" }
          Write-Host "Verifizierte Whisper-Engine und Modell liegen im Installer-Paket"
      - name: Smoke-Test der gebauten JARVIS.exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release\win-unpacked\JARVIS.exe" -ArgumentList "--smoke" -PassThru -Wait
          Get-Content "$env:TEMP\jarvis-smoke-report.json"
          if ($p.ExitCode -ne 0) { throw "Smoke-Test fehlgeschlagen ($($p.ExitCode))" }
      - name: Installer still installieren, starten, deinstallieren
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\JARVIS-Install"
          $i = Start-Process -FilePath "release\JARVIS_Setup.exe" -ArgumentList "/S","/D=$dir" -PassThru -Wait
          if ($i.ExitCode -ne 0) { throw "Installation fehlgeschlagen" }
          if (!(Test-Path "$dir\JARVIS.exe")) { throw "JARVIS.exe fehlt nach Installation" }
          if (!(Test-Path "$dir\resources\voice\whisper-cli.exe")) { throw "Whisper-Engine fehlt nach Installation" }
          if (!(Test-Path "$dir\resources\voice\ggml-base.bin")) { throw "Whisper-Modell fehlt nach Installation" }
          if (!(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\JARVIS.lnk")) { throw "Startmenü-Eintrag fehlt" }
          $s = Start-Process -FilePath "$dir\JARVIS.exe" -ArgumentList "--smoke" -PassThru -Wait
          if ($s.ExitCode -ne 0) { throw "Installierte App: Smoke-Test fehlgeschlagen" }
          $u = Start-Process -FilePath "$dir\Uninstall JARVIS.exe" -ArgumentList "/S" -PassThru -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\JARVIS.exe") { throw "Deinstallation unvollständig" }
          Write-Host "Installation, Start und Deinstallation erfolgreich"
      - uses: actions/upload-artifact@v5
        with:
          name: JARVIS-Windows
          path: |
            release/JARVIS_Setup.exe
            release/SHA256SUMS.txt
          retention-days: 7

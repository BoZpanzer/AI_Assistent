name: Tests

# Schnell und günstig (Linux): Unit-, Integrations- und Wake-Word-Tests bei jedem Push.
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci
